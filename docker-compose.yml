services:
  web:
    image: khadamat-gostar-web:local
    build:
      context: .
      args: { APP: web }
    environment:
      NODE_ENV: production
      PORT: 3000
    ports: ["3100:3000"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(\"http\").get(\"http://$(hostname):3000\", r => process.exit(r.statusCode < 400 ? 0 : 1)).on(\"error\", () => process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  admin:
    image: khadamat-gostar-admin:local
    build:
      context: .
      args: { APP: khadamat-gostar-admin }
    environment:
      NODE_ENV: production
      PORT: 3000
    ports: ["3102:3000"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    healthcheck:
      test: ['CMD-SHELL', 'node -e "require(\"http\").get(\"http://$(hostname):3000\", r => process.exit(r.statusCode < 400 ? 0 : 1)).on(\"error\", () => process.exit(1))"']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
